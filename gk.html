<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic GK Command Center - SSC CGL</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 850px;
            width: 100%;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent-blue);
        }

        .back-btn {
            background-color: #334155;
            color: var(--text-main);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background-color: #475569;
        }

        .add-module-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        .form-group {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            flex: 1;
            min-width: 200px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .btn {
            background-color: var(--accent-blue);
            color: #0f172a;
            font-weight: 600;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .module-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 20px;
            margin-bottom: 24px;
        }

        .module-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .module-title {
            margin: 0;
            color: var(--accent-blue);
            font-size: 1.2rem;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--accent-red);
            cursor: pointer;
            font-size: 0.85rem;
            padding: 4px 8px;
        }

        .progress-bar-bg {
            background-color: #334155;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .progress-bar-fill {
            background-color: var(--accent-green);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .task-list {
            list-style: none;
            padding: 0;
            margin: 0 0 16px 0;
        }

        .task-item {
            display: flex;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .task-item:last-child {
            border-bottom: none;
        }

        .task-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 12px;
            accent-color: var(--accent-green);
            cursor: pointer;
        }

        .task-label {
            font-size: 0.95rem;
            flex-grow: 1;
        }

        .completed {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .delete-task {
            color: var(--text-muted);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .delete-task:hover {
            color: var(--accent-red);
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 0;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>📚 GK Command Center</h1>
            <p style="margin: 4px 0 0 0; color: var(--text-muted); font-size: 0.85rem;">Custom Module & Weekly Goal Tracker</p>
        </div>
        <a href="index.html" class="back-btn">← Back to Main Tracker</a>
    </header>

    <!-- Form to Add New Subject/Module -->
    <div class="add-module-card">
        <h3 style="margin: 0 0 8px 0; font-size: 1rem;">➕ Create New GK Subject Module</h3>
        <div class="form-group">
            <input type="text" id="new-module-name" placeholder="e.g., Indian Polity, Modern History, Geography">
            <button class="btn" onclick="addModule()">Add Subject</button>
        </div>
    </div>

    <!-- Container for Rendered Modules -->
    <div id="modules-container"></div>
</div>

<script>
    // Data structure loaded from LocalStorage
    let gkData = JSON.parse(localStorage.getItem('gkMasterData')) || [];

    document.addEventListener("DOMContentLoaded", function() {
        renderModules();
    });

    function saveData() {
        localStorage.setItem('gkMasterData', JSON.stringify(gkData));
    }

    function addModule() {
        const input = document.getElementById('new-module-name');
        const name = input.value.trim();
        if (!name) return;

        const newModule = {
            id: Date.now(),
            name: name,
            tasks: []
        };

        gkData.push(newModule);
        saveData();
        renderModules();
        input.value = '';
    }

    function deleteModule(moduleId) {
        if (confirm("Are you sure you want to delete this entire subject module?")) {
            gkData = gkData.filter(m => m.id !== moduleId);
            saveData();
            renderModules();
        }
    }

    function addTask(moduleId) {
        const input = document.getElementById(`input-task-${moduleId}`);
        const taskText = input.value.trim();
        if (!taskText) return;

        const module = gkData.find(m => m.id === moduleId);
        if (module) {
            module.tasks.push({
                id: Date.now(),
                text: taskText,
                completed: false
            });
            saveData();
            renderModules();
        }
    }

    function toggleTask(moduleId, taskId) {
        const module = gkData.find(m => m.id === moduleId);
        if (module) {
            const task = module.tasks.find(t => t.id === taskId);
            if (task) {
                task.completed = !task.completed;
                saveData();
                renderModules();
            }
        }
    }

    function deleteTask(moduleId, taskId) {
        const module = gkData.find(m => m.id === moduleId);
        if (module) {
            module.tasks = module.tasks.filter(t => t.id !== taskId);
            saveData();
            renderModules();
        }
    }

    function renderModules() {
        const container = document.getElementById('modules-container');
        container.innerHTML = '';

        if (gkData.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    No subject modules created yet. Add your first subject (e.g., "Indian Polity") above to get started!
                </div>
            `;
            return;
        }

        gkData.forEach(module => {
            const totalTasks = module.tasks.length;
            const completedTasks = module.tasks.filter(t => t.completed).length;
            const percent = totalTasks === 0 ? 0 : Math.round((completedTasks / totalTasks) * 100);

            const card = document.createElement('div');
            card.className = 'module-card';

            card.innerHTML = `
                <div class="module-header">
                    <h3 class="module-title">🏛️ ${module.name}</h3>
                    <div>
                        <span style="font-size: 0.85rem; color: var(--text-muted); margin-right: 12px;">${completedTasks}/${totalTasks} Done (${percent}%)</span>
                        <button class="delete-btn" onclick="deleteModule(${module.id})">Delete Subject</button>
                    </div>
                </div>

                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" style="width: ${percent}%;"></div>
                </div>

                <ul class="task-list">
                    ${module.tasks.map(task => `
                        <li class="task-item">
                            <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${module.id},${task.id})">
                            <span class="task-label ${task.completed ? 'completed' : ''}">${task.text}</span>
                            <button class="delete-task" onclick="deleteTask(${module.id},${task.id})">✕</button>
                        </li>
                    `).join('')}
                </ul>

                <div class="form-group">
                    <input type="text" id="input-task-${module.id}" placeholder="Add goal (e.g., Week 1: Fundamental Rights)">
                    <button class="btn" style="padding: 8px 14px; font-size: 0.85rem;" onclick="addTask(${module.id})">Add Goal</button>
                </div>
            `;

            container.appendChild(card);
        });
    }
</script>

</body>
</html>
