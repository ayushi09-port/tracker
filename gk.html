<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GK Command Center - SSC CGL</title>
    <style>
        :root {
            --bg-color: #0d1322;
            --card-bg: #172136;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #2a3854;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 850px;
            width: 100%;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn {
            background-color: #243048;
            color: var(--text-main);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            border: 1px solid var(--border-color);
            transition: background 0.2s;
        }

        .back-btn:hover {
            background-color: #334363;
        }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .add-module-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        .form-group {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            flex: 1;
            min-width: 200px;
            background-color: #0d1322;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .btn {
            background-color: var(--accent-blue);
            color: #0d1322;
            font-weight: 600;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .reset-btn {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            color: var(--accent-red);
            border-color: var(--accent-red);
        }

        .module-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 20px;
            margin-bottom: 24px;
        }

        .module-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .module-title {
            margin: 0;
            color: var(--accent-blue);
            font-size: 1.25rem;
        }

        .module-target {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin: 4px 0 14px 0;
            font-style: italic;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--accent-red);
            cursor: pointer;
            font-size: 0.85rem;
            padding: 4px 8px;
        }

        .progress-bar-bg {
            background-color: #0d1322;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 18px;
        }

        .progress-bar-fill {
            background-color: var(--accent-green);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .task-list {
            list-style: none;
            padding: 0;
            margin: 0 0 16px 0;
        }

        .task-item {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .task-item:last-child {
            border-bottom: none;
        }

        .task-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 12px;
            accent-color: var(--accent-green);
            cursor: pointer;
        }

        .task-label {
            font-size: 0.95rem;
            flex-grow: 1;
            line-height: 1.4;
        }

        .completed {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .delete-task {
            color: var(--text-muted);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .delete-task:hover {
            color: var(--accent-red);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>📚 GK Command Center</h1>
            <p style="margin: 4px 0 0 0; color: var(--text-muted); font-size: 0.85rem;">Official Complete SSC CGL General Awareness Syllabus</p>
        </div>
        <a href="index.html" class="back-btn">← Back to Main Tracker</a>
    </header>

    <div class="controls-bar">
        <span style="font-size: 0.85rem; color: var(--text-muted);">Track or add goals dynamically below.</span>
        <button class="reset-btn" onclick="resetToDefault()">↺ Restore Master Syllabus</button>
    </div>

    <!-- Form to Add Custom Subject/Module -->
    <div class="add-module-card">
        <h3 style="margin: 0 0 8px 0; font-size: 1rem;">➕ Add Custom Subject or Module</h3>
        <div class="form-group">
            <input type="text" id="new-module-name" placeholder="Subject Name (e.g., Computer Knowledge)">
            <input type="text" id="new-module-target" placeholder="Target/Goal description...">
            <button class="btn" onclick="addModule()">Add Subject</button>
        </div>
    </div>

    <!-- Container for Modules -->
    <div id="modules-container"></div>
</div>

<script>
    const defaultSyllabus = [
        {
            id: 1,
            name: "🏛️ Module 1: Indian Polity (November – December 2026)",
            target: "Target: Master the source code of India's governance system (Highest ROI).",
            tasks: [
                { id: 101, text: "Polity Week 1: Making of Constitution, Drafting Committee & Borrowed Sources", completed: false },
                { id: 102, text: "Polity Week 2: Preamble, Parts 1-4 & Schedules 1 to 12 Overview", completed: false },
                { id: 103, text: "Polity Week 3: Fundamental Rights (Articles 12 to 35) & Writs (Art 32)", completed: false },
                { id: 104, text: "Polity Week 4: Directive Principles (DPSP 36-51) & Fundamental Duties (51A)", completed: false },
                { id: 105, text: "Polity Week 5: President, Vice President & Pardoning Powers (Art 52-72)", completed: false },
                { id: 106, text: "Polity Week 6: Prime Minister, Council of Ministers & Attorney General (Art 76)", completed: false },
                { id: 107, text: "Polity Week 7: Parliament (Lok Sabha vs Rajya Sabha) & How a Bill Passes", completed: false },
                { id: 108, text: "Polity Week 8: Supreme Court, High Courts, CAG & 300 PYQ Marathon Sweep", completed: false }
            ]
        },
        {
            id: 2,
            name: "🏛️ Ancient & Medieval History (January 2027)",
            target: "Target: Master key dynasties, culture, and high-yield SSC questions.",
            tasks: [
                { id: 201, text: "Ancient History (Week 1): Indus Valley Civilization Sites, Town Planning & Vedic Culture", completed: false },
                { id: 202, text: "Ancient History (Week 2): Buddhism, Jainism, Mauryan Empire (Ashoka) & Gupta Dynasty", completed: false },
                { id: 203, text: "Medieval History (Week 3): Delhi Sultanate (Slave, Khilji, Tughlaq, Sayyid, Lodi Dynasties)", completed: false },
                { id: 204, text: "Medieval History (Week 4): Mughal Empire (Babur to Aurangzeb), Bhakti & Sufi Movements", completed: false }
            ]
        },
        {
            id: 3,
            name: "📜 Module 2: Modern Indian History (February 2027)",
            target: "Target: Treat it like a political drama movie from 1857 to Independence.",
            tasks: [
                { id: 301, text: "History Week 1: Revolt of 1857 (Causes, Key Leaders & Centers)", completed: false },
                { id: 302, text: "History Week 2: Socio-Religious Movements (Brahmo Samaj, Arya Samaj, etc.)", completed: false },
                { id: 303, text: "History Week 3: Formation of INC (1885), Moderates vs Extremists & Partition of Bengal (1905)", completed: false },
                { id: 304, text: "History Week 4: The Gandhian Era Part 1 (Non-Cooperation & Khilafat Movement)", completed: false },
                { id: 305, text: "History Week 5: The Gandhian Era Part 2 (Civil Disobedience & Salt March)", completed: false },
                { id: 306, text: "History Week 6: Revolutionary Movements (Bhagat Singh, Azad, INA & Subhash Chandra Bose)", completed: false },
                { id: 307, text: "History Week 7: Quit India Movement (1942) to Indian Independence Act (1947)", completed: false },
                { id: 308, text: "History Week 8: Important Governor-Generals, Viceroys & 300 PYQ Sweep", completed: false }
            ]
        },
        {
            id: 4,
            name: "🏔️ Module 3: Physical & Indian Geography (March 2027)",
            target: "Target: Focus heavily on maps, river systems, and physical features.",
            tasks: [
                { id: 401, text: "Geography Week 1: Solar System, Earth Latitudes, Longitudes & Interior Structure", completed: false },
                { id: 402, text: "Geography Week 2: Indian Physical Geography (Himalayas, Northern Plains & Peninsular Plateau)", completed: false },
                { id: 403, text: "Geography Week 3: Indian River Systems (Indus, Ganga, Brahmaputra & Peninsular Rivers)", completed: false },
                { id: 404, text: "Geography Week 4: Indian Climate, Soil Types, Agriculture & National Parks (200 PYQs)", completed: false }
            ]
        },
        {
            id: 5,
            name: "🏺 Module 4: Static GK & Culture Sprint (April 2027)",
            target: "Target: Pure high-yield memory retention right before mock season.",
            tasks: [
                { id: 501, text: "Static Week 1: Classical & Folk Dances of India (State-wise)", completed: false },
                { id: 502, text: "Static Week 2: Famous Temples, Monuments & UNESCO World Heritage Sites", completed: false },
                { id: 503, text: "Static Week 3: Important Musical Instruments & Famous Exponents (Tabla, Sitar, Shehnai)", completed: false },
                { id: 504, text: "Static Week 4: Sports Trophies, National Parks & Final 400 PYQ Master Marathon", completed: false }
            ]
        },
        {
            id: 6,
            name: "🔬 General Science Foundations (10th NCERT Level)",
            target: "Target: Quick 10th NCERT high-yield recall for Physics, Chemistry & Biology.",
            tasks: [
                { id: 601, text: "Biology: Cell, Human Body Systems (Digestive, Respiratory, Nervous) & Vitamins/Diseases", completed: false },
                { id: 602, text: "Physics: SI Units, Laws of Motion, Work/Energy, Light, Sound & Electricity Basics", completed: false },
                { id: 603, text: "Chemistry: Acids, Bases, Salts, Periodic Table, Metals/Non-Metals & Everyday Formulas", completed: false }
            ]
        },
        {
            id: 7,
            name: "📊 Indian Economy Essentials",
            target: "Target: Basic macroeconomics, inflation, banking, and Five-Year plans.",
            tasks: [
                { id: 701, text: "Econ: GDP, Inflation, Repo Rate, RBI Monetary Policy & Banking Basics", completed: false },
                { id: 702, text: "Econ: Five-Year Plans, Union Budget, NITI Aayog & Poverty/Unemployment Schemes", completed: false }
            ]
        },
        {
            id: 8,
            name: "📰 Current Affairs (Oct 2026 – March 2027 Track)",
            target: "Target: Cover last 6 months leading directly up to CGL Tier-1.",
            tasks: [
                { id: 801, text: "CA Month 1: Major Government Schemes & Ministries (Last 6 Months)", completed: false },
                { id: 802, text: "CA Month 2: National & International Appointments, Awards & Honours", completed: false },
                { id: 803, text: "CA Month 3: Sports Tournaments, Grand Slams & Defense Exercises", completed: false },
                { id: 804, text: "CA Month 4: Books & Authors, Summits & Important Days/Themes", completed: false }
            ]
        }
    ];

    // Key updated to V3 to instantly override old localStorage state
    let gkData = JSON.parse(localStorage.getItem('gkMasterSyllabusV3')) || defaultSyllabus;

    document.addEventListener("DOMContentLoaded", function() {
        renderModules();
    });

    function saveData() {
        localStorage.setItem('gkMasterSyllabusV3', JSON.stringify(gkData));
    }

    function addModule() {
        const nameInput = document.getElementById('new-module-name');
        const targetInput = document.getElementById('new-module-target');
        const name = nameInput.value.trim();
        const target = targetInput.value.trim();
        
        if (!name) return;

        const newModule = {
            id: Date.now(),
            name: name,
            target: target ? `Target: ${target}` : '',
            tasks: []
        };

        gkData.push(newModule);
        saveData();
        renderModules();
        nameInput.value = '';
        targetInput.value = '';
    }

    function deleteModule(moduleId) {
        if (confirm("Are you sure you want to delete this subject module?")) {
            gkData = gkData.filter(m => m.id !== moduleId);
            saveData();
            renderModules();
        }
    }

    function addTask(moduleId) {
        const input = document.getElementById(`input-task-${moduleId}`);
        const taskText = input.value.trim();
        if (!taskText) return;

        const module = gkData.find(m => m.id === moduleId);
        if (module) {
            module.tasks.push({
                id: Date.now(),
                text: taskText,
                completed: false
            });
            saveData();
            renderModules();
        }
    }

    function toggleTask(moduleId, taskId) {
        const module = gkData.find(m => m.id === moduleId);
        if (module) {
            const task = module.tasks.find(t => t.id === taskId);
            if (task) {
                task.completed = !task.completed;
                saveData();
                renderModules();
            }
        }
    }

    function deleteTask(moduleId, taskId) {
        const module = gkData.find(m => m.id === moduleId);
        if (module) {
            module.tasks = module.tasks.filter(t => t.id !== taskId);
            saveData();
            renderModules();
        }
    }

    function resetToDefault() {
        if (confirm("Reset everything back to the master syllabus layout?")) {
            gkData = defaultSyllabus;
            saveData();
            renderModules();
        }
    }

    function renderModules() {
        const container = document.getElementById('modules-container');
        container.innerHTML = '';

        gkData.forEach(module => {
            const totalTasks = module.tasks.length;
            const completedTasks = module.tasks.filter(t => t.completed).length;
            const percent = totalTasks === 0 ? 0 : Math.round((completedTasks / totalTasks) * 100);

            const card = document.createElement('div');
            card.className = 'module-card';

            card.innerHTML = `
                <div class="module-header">
                    <h3 class="module-title">${module.name}</h3>
                    <div>
                        <span style="font-size: 0.85rem; color: var(--text-muted); margin-right: 12px;">${completedTasks}/${totalTasks} Done (${percent}%)</span>
                        <button class="delete-btn" onclick="deleteModule(${module.id})">Delete Subject</button>
                    </div>
                </div>
                ${module.target ? `<div class="module-target">${module.target}</div>` : ''}

                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" style="width: ${percent}%;"></div>
                </div>

                <ul class="task-list">
                    ${module.tasks.map(task => `
                        <li class="task-item">
                            <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${module.id},${task.id})">
                            <span class="task-label ${task.completed ? 'completed' : ''}">${task.text}</span>
                            <button class="delete-task" onclick="deleteTask(${module.id},${task.id})">✕</button>
                        </li>
                    `).join('')}
                </ul>

                <div class="form-group">
                    <input type="text" id="input-task-${module.id}" placeholder="Add goal or task...">
                    <button class="btn" style="padding: 8px 14px; font-size: 0.85rem;" onclick="addTask(${module.id})">Add Goal</button>
                </div>
            `;

            container.appendChild(card);
        });
    }
</script>

</body>
</html>
