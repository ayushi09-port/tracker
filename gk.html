<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic GK Command Center - SSC CGL</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 850px;
            width: 100%;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent-blue);
        }

        .back-btn {
            background-color: #334155;
            color: var(--text-main);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background-color: #475569;
        }

        .add-module-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        .form-group {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            flex: 1;
            min-width: 200px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .btn {
            background-color: var(--accent-blue);
            color: #0f172a;
            font-weight: 600;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .module-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 20px;
            margin-bottom: 24px;
        }

        .module-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .module-title {
            margin: 0;
            color: var(--accent-blue);
            font-size: 1.2rem;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--accent-red);
            cursor: pointer;
            font-size: 0.85rem;
            padding: 4px 8px;
        }

        .progress-bar-bg {
            background-color: #334155;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .progress-bar-fill {
            background-color: var(--accent-green);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .task-list {
            list-style: none;
            padding: 0;
            margin: 0 0 16px 0;
        }

        .task-item {
            display: flex;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .task-item:last-child {
            border-bottom: none;
        }

        .task-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 12px;
            accent-color: var(--accent-green);
            cursor: pointer;
        }

        .task-label {
            font-size: 0.95rem;
            flex-grow: 1;
        }

        .completed {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .delete-task {
            color: var(--text-muted);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .delete-task:hover {
            color: var(--accent-red);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>📚 GK Command Center</h1>
            <p style="margin: 4px 0 0 0; color: var(--text-muted); font-size: 0.85rem;">Official Complete SSC CGL General Awareness Syllabus</p>
        </div>
        <a href="index.html" class="back-btn">← Back to Main Tracker</a>
    </header>

    <!-- Form to Add Custom Subject/Module -->
    <div class="add-module-card">
        <h3 style="margin: 0 0 8px 0; font-size: 1rem;">➕ Add Custom Subject or Topic</h3>
        <div class="form-group">
            <input type="text" id="new-module-name" placeholder="e.g., Computer Awareness, Extra Quizzes">
            <button class="btn" onclick="addModule()">Add Subject</button>
        </div>
    </div>

    <!-- Container for Rendered Modules -->
    <div id="modules-container"></div>
</div>

<script>
    // Complete Official Syllabus pre-loaded
    const defaultSyllabus = [
        {
            id: 1,
            name: "Indian Polity (Nov – Dec 2026)",
            tasks: [
                { id: 101, text: "Polity W1: Making of Constitution, Drafting Committee & Borrowed Sources", completed: false },
                { id: 102, text: "Polity W2: Preamble, Parts 1-4 & Schedules 1 to 12 Overview", completed: false },
                { id: 103, text: "Polity W3: Fundamental Rights (Articles 12 to 35) & Writs (Art 32)", completed: false },
                { id: 104, text: "Polity W4: Directive Principles (DPSP 36-51) & Fundamental Duties (51A)", completed: false },
                { id: 105, text: "Polity W5: President, Vice President & Pardoning Powers (Art 52-72)", completed: false },
                { id: 106, text: "Polity W6: Prime Minister, Council of Ministers & Attorney General (Art 76)", completed: false },
                { id: 107, text: "Polity W7: Parliament (Lok Sabha vs Rajya Sabha) & How a Bill Passes", completed: false },
                { id: 108, text: "Polity W8: Supreme Court, High Courts, CAG & 300 PYQ Marathon Sweep", completed: false }
            ]
        },
        {
            id: 2,
            name: "Ancient & Medieval History (Jan 2027)",
            tasks: [
                { id: 201, text: "Ancient W1: Indus Valley Civilization Sites, Town Planning & Vedic Culture", completed: false },
                { id: 202, text: "Ancient W2: Buddhism, Jainism, Mauryan Empire (Ashoka) & Gupta Dynasty", completed: false },
                { id: 203, text: "Medieval W1: Delhi Sultanate (Slave, Khilji, Tughlaq, Sayyid, Lodi Dynasties)", completed: false },
                { id: 204, text: "Medieval W2: Mughal Empire (Babur to Aurangzeb), Bhakti & Sufi Movements", completed: false }
            ]
        },
        {
            id: 3,
            name: "Modern Indian History (Feb 2027)",
            tasks: [
                { id: 301, text: "Modern W1: Revolt of 1857 & Socio-Religious Reform Movements (Brahmo/Arya Samaj)", completed: false },
                { id: 302, text: "Modern W2: Formation of INC (1885), Moderates vs Extremists & Bengal Partition (1905)", completed: false },
                { id: 303, text: "Modern W3: Gandhian Era (Non-Cooperation, Civil Disobedience & Salt March)", completed: false },
                { id: 304, text: "Modern W4: Revolutionary Movements, Quit India (1942) to Independence (1947)", completed: false }
            ]
        },
        {
            id: 4,
            name: "Geography & Earth Systems (March 2027)",
            tasks: [
                { id: 401, text: "Geog W1: Solar System, Earth Latitudes, Longitudes & Interior Structure", completed: false },
                { id: 402, text: "Geog W2: Indian Physical Geography (Himalayas, Plains & Peninsular Plateau)", completed: false },
                { id: 403, text: "Geog W3: Indian River Systems (Indus, Ganga, Brahmaputra & Peninsular Rivers)", completed: false },
                { id: 404, text: "Geog W4: Indian Climate, Soil Types, Agriculture & National Parks (200 PYQs)", completed: false }
            ]
        },
        {
            id: 5,
            name: "Static GK & Culture Sprint (April 2027)",
            tasks: [
                { id: 501, text: "Static W1: Classical & Folk Dances of India (State-wise & Famous Dancers)", completed: false },
                { id: 502, text: "Static W2: Famous Temples, Monuments & UNESCO World Heritage Sites", completed: false },
                { id: 503, text: "Static W3: Important Musical Instruments & Maestros (Tabla, Sitar, Shehnai)", completed: false },
                { id: 504, text: "Static W4: Sports Trophies, International Orgs & Final 400 PYQ Master Marathon", completed: false }
            ]
        },
        {
            id: 6,
            name: "General Science Foundations (10th NCERT Level)",
            tasks: [
                { id: 601, text: "Biology: Cell Structure, Human Body Systems (Digestive/Nervous) & Vitamins/Diseases", completed: false },
                { id: 602, text: "Physics: SI Units, Laws of Motion, Work/Energy, Light, Sound & Electricity", completed: false },
                { id: 603, text: "Chemistry: Acids, Bases, Salts, Periodic Table, Metals/Non-Metals & Daily Chemical Names", completed: false }
            ]
        },
        {
            id: 7,
            name: "Indian Economy Essentials",
            tasks: [
                { id: 701, text: "Econ: GDP, Inflation, Repo Rate, RBI Monetary Policy & Banking Basics", completed: false },
                { id: 702, text: "Econ: Five-Year Plans, Union Budget, NITI Aayog & Poverty/Unemployment Schemes", completed: false }
            ]
        },
        {
            id: 8,
            name: "Current Affairs (Oct 2026 – March 2027 Track)",
            tasks: [
                { id: 801, text: "CA 1: Major Government Schemes & Ministries (Last 6 Months)", completed: false },
                { id: 802, text: "CA 2: National & International Appointments, Awards & Honours", completed: false },
                { id: 803, text: "CA 3: Sports Tournaments, Grand Slams & Defense Exercises", completed: false },
                { id: 804, text: "CA 4: Books & Authors, Summits & Important Days/Themes", completed: false }
            ]
        }
    ];

    // Load from LocalStorage or initialize with default syllabus
    let gkData = JSON.parse(localStorage.getItem('gkMasterData')) || defaultSyllabus;

    document.addEventListener("DOMContentLoaded", function() {
        renderModules();
    });

    function saveData() {
        localStorage.setItem('gkMasterData', JSON.stringify(gkData));
    }

    function addModule() {
        const input = document.getElementById('new-module-name');
        const name = input.value.trim();
        if (!name) return;

        const newModule = {
            id: Date.now(),
            name: name,
            tasks: []
        };

        gkData.push(newModule);
        saveData();
        renderModules();
        input.value = '';
    }

    function deleteModule(moduleId) {
        if (confirm("Are you sure you want to delete this subject module?")) {
            gkData = gkData.filter(m => m.id !== moduleId);
            saveData();
            renderModules();
        }
    }

    function addTask(moduleId) {
        const input = document.getElementById(`input-task-${moduleId}`);
        const taskText = input.value.trim();
        if (!taskText) return;

        const module = gkData.find(m => m.id === moduleId);
        if (module) {
            module.tasks.push({
                id: Date.now(),
                text: taskText,
                completed: false
            });
            saveData();
            renderModules();
        }
    }

    function toggleTask(moduleId, taskId) {
        const module = gkData.find(m => m.id === moduleId);
        if (module) {
            const task = module.tasks.find(t => t.id === taskId);
            if (task) {
                task.completed = !task.completed;
                saveData();
                renderModules();
            }
        }
    }

    function deleteTask(moduleId, taskId) {
        const module = gkData.find(m => m.id === moduleId);
        if (module) {
            module.tasks = module.tasks.filter(t => t.id !== taskId);
            saveData();
            renderModules();
        }
    }

    function renderModules() {
        const container = document.getElementById('modules-container');
        container.innerHTML = '';

        gkData.forEach(module => {
            const totalTasks = module.tasks.length;
            const completedTasks = module.tasks.filter(t => t.completed).length;
            const percent = totalTasks === 0 ? 0 : Math.round((completedTasks / totalTasks) * 100);

            const card = document.createElement('div');
            card.className = 'module-card';

            card.innerHTML = `
                <div class="module-header">
                    <h3 class="module-title">📌 ${module.name}</h3>
                    <div>
                        <span style="font-size: 0.85rem; color: var(--text-muted); margin-right: 12px;">${completedTasks}/${totalTasks} Done (${percent}%)</span>
                        <button class="delete-btn" onclick="deleteModule(${module.id})">Delete Subject</button>
                    </div>
                </div>

                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" style="width: ${percent}%;"></div>
                </div>

                <ul class="task-list">
                    ${module.tasks.map(task => `
                        <li class="task-item">
                            <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${module.id},${task.id})">
                            <span class="task-label ${task.completed ? 'completed' : ''}">${task.text}</span>
                            <button class="delete-task" onclick="deleteTask(${module.id},${task.id})">✕</button>
                        </li>
                    `).join('')}
                </ul>

                <div class="form-group">
                    <input type="text" id="input-task-${module.id}" placeholder="Add goal (e.g., Week 5: Art & Culture)">
                    <button class="btn" style="padding: 8px 14px; font-size: 0.85rem;" onclick="addTask(${module.id})">Add Goal</button>
                </div>
            `;

            container.appendChild(card);
        });
    }
</script>

</body>
</html>
