<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSC CGL 2027 Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937;
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12 antialiased selection:bg-brand-500 selection:text-white">

    <!-- Navigation / Header -->
    <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 shadow-lg">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-brand-600 text-white p-2 rounded-xl shadow-md shadow-brand-500/20">
                    <i class="fa-solid fa-bullseye text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight text-white">SSC CGL 2027</h1>
                    <p class="text-xs text-slate-400" id="currentDateDisplay">Loading date...</p>
                </div>
            </div>
            <button id="resetAllBtn" class="text-xs bg-slate-800 hover:bg-rose-900/40 text-slate-300 hover:text-rose-400 border border-slate-700 hover:border-rose-800/50 px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5">
                <i class="fa-solid fa-rotate-left"></i>
                <span>Reset</span>
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 pt-4 space-y-5">

        <!-- Mode Switcher Banner -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-sm">
            <div class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2.5 flex items-center gap-1.5">
                <i class="fa-solid fa-sliders text-brand-500"></i> Active Target Mode
            </div>
            <div class="grid grid-cols-2 gap-2 p-1 bg-slate-950 rounded-xl border border-slate-800/80">
                <button id="modeSprintBtn" onclick="setMode('sprint')" class="flex flex-col items-center justify-center py-2.5 px-3 rounded-lg text-xs font-medium transition-all gap-1">
                    <span class="flex items-center gap-1.5 font-bold text-sm">
                        <i class="fa-solid fa-rocket"></i> Full Sprint
                    </span>
                    <span class="text-[10px] opacity-80">4–5 hrs/day</span>
                </button>
                <button id="modeSemBtn" onclick="setMode('sem')" class="flex flex-col items-center justify-center py-2.5 px-3 rounded-lg text-xs font-medium transition-all gap-1">
                    <span class="flex items-center gap-1.5 font-bold text-sm">
                        <i class="fa-solid fa-graduation-cap"></i> Sem-5 Mode
                    </span>
                    <span class="text-[10px] opacity-80">1 hr Maintenance</span>
                </button>
            </div>
        </section>

        <!-- Overall Progress Metrics -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-4 shadow-sm">
            <div class="flex justify-between items-end">
                <div>
                    <h2 class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Maths Syllabus Progress</h2>
                    <div class="flex items-baseline space-x-2 mt-0.5">
                        <span id="overallPercentage" class="text-3xl font-extrabold text-white">0%</span>
                        <span id="videoFraction" class="text-sm text-slate-400 font-medium">0 / 360 vids</span>
                    </div>
                </div>
                <div class="text-right">
                    <span class="text-[11px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-1 rounded-full font-medium inline-block">
                        <i class="fa-regular fa-calendar-check mr-1"></i> Target: April 2027
                    </span>
                </div>
            </div>

            <!-- Big Progress Bar -->
            <div class="w-full bg-slate-950 h-3.5 rounded-full overflow-hidden p-0.5 border border-slate-800">
                <div id="overallProgressBar" class="bg-gradient-to-r from-brand-600 to-emerald-400 h-full rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
            </div>

            <!-- Detailed Stat Cards -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 pt-1">
                <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-2.5 text-center">
                    <p class="text-[10px] text-slate-400 uppercase font-semibold">Total Videos</p>
                    <p class="text-lg font-bold text-slate-200 mt-0.5">360</p>
                </div>
                <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-2.5 text-center">
                    <p class="text-[10px] text-slate-400 uppercase font-semibold">Completed</p>
                    <p id="statCompleted" class="text-lg font-bold text-emerald-400 mt-0.5">0</p>
                </div>
                <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-2.5 text-center">
                    <p class="text-[10px] text-slate-400 uppercase font-semibold">Remaining</p>
                    <p id="statRemaining" class="text-lg font-bold text-amber-400 mt-0.5">360</p>
                </div>
                <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-2.5 text-center">
                    <p class="text-[10px] text-slate-400 uppercase font-semibold">Est. Days (2/day)</p>
                    <p id="statEstDays" class="text-lg font-bold text-brand-500 mt-0.5">180</p>
                </div>
            </div>
        </section>

        <!-- Daily Checklist Section -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3 shadow-sm">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-list-check text-emerald-400"></i>
                    <h2 class="font-bold text-base text-white">Daily Tasks</h2>
                </div>
                <button onclick="resetDailyTasks()" class="text-[11px] text-slate-400 hover:text-slate-200 bg-slate-800 hover:bg-slate-700 px-2.5 py-1 rounded-lg border border-slate-700 transition">
                    <i class="fa-solid fa-arrows-rotate mr-1"></i> Clear Checks
                </button>
            </div>

            <!-- Daily Progress Bar -->
            <div class="space-y-1">
                <div class="flex justify-between text-xs text-slate-400 font-medium">
                    <span id="dailyChecklistCount">0 / 0 completed</span>
                    <span id="dailyChecklistPct">0%</span>
                </div>
                <div class="w-full bg-slate-950 h-2 rounded-full overflow-hidden border border-slate-800">
                    <div id="dailyProgressBar" class="bg-emerald-500 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>

            <!-- Checkbox items container -->
            <div id="checklistContainer" class="space-y-2 pt-1">
                <!-- Dynamically populated via JavaScript -->
            </div>
        </section>

        <!-- Maths Clusters Breakdown -->
        <section class="space-y-3">
            <div class="flex items-center justify-between px-1">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-layer-group text-brand-500"></i>
                    <h2 class="font-bold text-base text-white">Maths Clusters (8)</h2>
                </div>
                <span class="text-xs text-slate-400">Tap <i class="fa-solid fa-plus text-brand-500"></i> or <i class="fa-solid fa-minus text-rose-500"></i> to update</span>
            </div>

            <div id="clustersContainer" class="space-y-3">
                <!-- Clusters populated via JS -->
            </div>
        </section>

    </main>

    <script>
        // Data Definitions
        const CLUSTERS_CONFIG = [
            { id: "c1", name: "1. Foundation Phase", total: 56, icon: "fa-calculator" },
            { id: "c2", name: "2. Ratio Clusters", total: 70, icon: "fa-percent" },
            { id: "c3", name: "3. Commercial Maths", total: 80, icon: "fa-coins" },
            { id: "c4", name: "4. Speed - Time Cluster", total: 31, icon: "fa-gauge-high" },
            { id: "c5", name: "5. Algebra", total: 26, icon: "fa-square-root-variable" },
            { id: "c6", name: "6. Geometry & Mensuration", total: 88, icon: "fa-shapes" },
            { id: "c7", name: "7. Trigonometry", total: 28, icon: "fa-triangle-circle-square" },
            { id: "c8", name: "8. Data & Stats", total: 30, icon: "fa-chart-pie" }
        ];

        const TASKS_SPRINT = [
            { id: "task_math_vid", label: "Maths: Watch 2 Concept Videos" },
            { id: "task_math_pyq", label: "Maths: Solve 20–25 PYQs" },
            { id: "task_gk", label: "GK: 1 Sub-topic + Summary Notes" },
            { id: "task_eng_vocab", label: "English: 30m Vocab & Grammar Drills" },
            { id: "task_eng_listen", label: "English: 30m Video Listening / Reading" },
            { id: "task_reasoning", label: "Reasoning: 1 Video / 20 PYQ Practice" }
        ];

        const TASKS_SEM = [
            { id: "task_sem_math", label: "Maths: Solve 15 Maintenance PYQs / Formulas" },
            { id: "task_sem_eng", label: "English: 15m Rapid Vocab Review" },
            { id: "task_sem_degree", label: "B.Sc. Degree: Zoology / Botany / Chemistry Study" }
        ];

        // Default State
        const DEFAULT_STATE = {
            mode: "sprint", // 'sprint' or 'sem'
            clusterProgress: {
                c1: 0, c2: 0, c3: 0, c4: 0, c5: 0, c6: 0, c7: 0, c8: 0
            },
            dailyTasks: {},
            lastDate: new Date().toDateString()
        };

        let appState = loadState();

        // Initialize application
        document.addEventListener("DOMContentLoaded", () => {
            checkAutoDailyReset();
            initDateDisplay();
            renderApp();

            document.getElementById("resetAllBtn").addEventListener("click", () => {
                if (confirm("Are you sure you want to reset all saved progress?")) {
                    localStorage.removeItem("ssc_cgl_2027_data");
                    appState = loadState();
                    renderApp();
                }
            });
        });

        // Load state from local storage
        function loadState() {
            const saved = localStorage.getItem("ssc_cgl_2027_data");
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    return { ...DEFAULT_STATE, ...parsed };
                } catch (e) {
                    console.error("Error parsing stored data", e);
                }
            }
            return JSON.parse(JSON.stringify(DEFAULT_STATE));
        }

        // Save state to local storage
        function saveState() {
            localStorage.setItem("ssc_cgl_2027_data", JSON.stringify(appState));
        }

        // Date Display
        function initDateDisplay() {
            const now = new Date();
            const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
            document.getElementById("currentDateDisplay").innerText = now.toLocaleDateString('en-US', options);
        }

        // Auto-reset checklist if date changes
        function checkAutoDailyReset() {
            const today = new Date().toDateString();
            if (appState.lastDate !== today) {
                appState.dailyTasks = {};
                appState.lastDate = today;
                saveState();
            }
        }

        // Set mode
        function setMode(newMode) {
            appState.mode = newMode;
            saveState();
            renderApp();
        }

        // Main Render Function
        function renderApp() {
            renderModeUI();
            renderMathsSummary();
            renderDailyChecklist();
            renderClustersList();
        }

        // Render Mode Selector Buttons
        function renderModeUI() {
            const sprintBtn = document.getElementById("modeSprintBtn");
            const semBtn = document.getElementById("modeSemBtn");

            if (appState.mode === "sprint") {
                sprintBtn.className = "flex flex-col items-center justify-center py-2.5 px-3 rounded-lg text-xs font-medium transition-all gap-1 bg-brand-600 text-white shadow-md shadow-brand-500/20 border border-brand-500";
                semBtn.className = "flex flex-col items-center justify-center py-2.5 px-3 rounded-lg text-xs font-medium transition-all gap-1 text-slate-400 hover:text-slate-200 hover:bg-slate-900";
            } else {
                semBtn.className = "flex flex-col items-center justify-center py-2.5 px-3 rounded-lg text-xs font-medium transition-all gap-1 bg-amber-600 text-white shadow-md shadow-amber-500/20 border border-amber-500";
                sprintBtn.className = "flex flex-col items-center justify-center py-2.5 px-3 rounded-lg text-xs font-medium transition-all gap-1 text-slate-400 hover:text-slate-200 hover:bg-slate-900";
            }
        }

        // Calculate and Render Maths Metrics
        function renderMathsSummary() {
            let totalVids = 0;
            let completedVids = 0;

            CLUSTERS_CONFIG.forEach(c => {
                totalVids += c.total;
                completedVids += (appState.clusterProgress[c.id] || 0);
            });

            const pct = Math.min(100, Math.round((completedVids / totalVids) * 100));
            const remaining = Math.max(0, totalVids - completedVids);
            const estDays = Math.ceil(remaining / 2);

            document.getElementById("overallPercentage").innerText = `${pct}%`;
            document.getElementById("videoFraction").innerText = `${completedVids} / ${totalVids} vids`;
            document.getElementById("overallProgressBar").style.width = `${pct}%`;

            document.getElementById("statCompleted").innerText = completedVids;
            document.getElementById("statRemaining").innerText = remaining;
            document.getElementById("statEstDays").innerText = estDays;
        }

        // Render Daily Checklist
        function renderDailyChecklist() {
            const container = document.getElementById("checklistContainer");
            container.innerHTML = "";

            const currentTasks = appState.mode === "sprint" ? TASKS_SPRINT : TASKS_SEM;
            let completedCount = 0;

            currentTasks.forEach(task => {
                const isChecked = !!appState.dailyTasks[task.id];
                if (isChecked) completedCount++;

                const taskEl = document.createElement("label");
                taskEl.className = `flex items-center justify-between p-3 rounded-xl border transition-all cursor-pointer select-none ${
                    isChecked 
                        ? "bg-emerald-950/20 border-emerald-800/50 text-slate-300 line-through" 
                        : "bg-slate-950/60 border-slate-800/80 text-slate-200 hover:border-slate-700"
                }`;

                taskEl.innerHTML = `
                    <span class="text-xs sm:text-sm font-medium pr-2">${task.label}</span>
                    <input type="checkbox" ${isChecked ? "checked" : ""} class="w-5 h-5 accent-emerald-500 rounded border-slate-700 bg-slate-900 cursor-pointer">
                `;

                const checkbox = taskEl.querySelector("input");
                checkbox.addEventListener("change", (e) => {
                    appState.dailyTasks[task.id] = e.target.checked;
                    saveState();
                    renderDailyChecklist();
                });

                container.appendChild(taskEl);
            });

            const total = currentTasks.length;
            const pct = total > 0 ? Math.round((completedCount / total) * 100) : 0;

            document.getElementById("dailyChecklistCount").innerText = `${completedCount} / ${total} completed`;
            document.getElementById("dailyChecklistPct").innerText = `${pct}%`;
            document.getElementById("dailyProgressBar").style.width = `${pct}%`;
        }

        function resetDailyTasks() {
            appState.dailyTasks = {};
            saveState();
            renderDailyChecklist();
        }

        // Render Clusters List with Controls
        function renderClustersList() {
            const container = document.getElementById("clustersContainer");
            container.innerHTML = "";

            CLUSTERS_CONFIG.forEach(c => {
                const count = appState.clusterProgress[c.id] || 0;
                const pct = Math.min(100, Math.round((count / c.total) * 100));

                const card = document.createElement("div");
                card.className = "bg-slate-900 border border-slate-800 rounded-2xl p-3.5 space-y-2.5 shadow-sm";

                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-2.5">
                            <div class="w-8 h-8 rounded-lg bg-slate-800 border border-slate-700/80 flex items-center justify-center text-brand-400 text-xs">
                                <i class="fa-solid ${c.icon}"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-sm text-slate-100">${c.name}</h3>
                                <p class="text-[11px] text-slate-400">${count} of ${c.total} videos (${pct}%)</p>
                            </div>
                        </div>

                        <!-- Counter Controls -->
                        <div class="flex items-center space-x-1 bg-slate-950 border border-slate-800 p-1 rounded-xl">
                            <button onclick="adjustCluster('${c.id}', -1)" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-rose-400 font-bold active:scale-95 transition flex items-center justify-center">
                                <i class="fa-solid fa-minus text-xs"></i>
                            </button>
                            <input type="number" min="0" max="${c.total}" value="${count}" 
                                onchange="setClusterValue('${c.id}', this.value, ${c.total})"
                                class="w-10 text-center bg-transparent text-sm font-bold text-slate-100 focus:outline-none">
                            <button onclick="adjustCluster('${c.id}', 1)" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-emerald-400 font-bold active:scale-95 transition flex items-center justify-center">
                                <i class="fa-solid fa-plus text-xs"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Cluster Progress Bar -->
                    <div class="w-full bg-slate-950 h-2 rounded-full overflow-hidden border border-slate-800/80">
                        <div class="bg-brand-500 h-full rounded-full transition-all duration-300" style="width: ${pct}%"></div>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        // Adjust Cluster Value via Buttons
        function adjustCluster(clusterId, delta) {
            const config = CLUSTERS_CONFIG.find(c => c.id === clusterId);
            if (!config) return;

            let current = appState.clusterProgress[clusterId] || 0;
            let updated = current + delta;

            if (updated < 0) updated = 0;
            if (updated > config.total) updated = config.total;

            appState.clusterProgress[clusterId] = updated;
            saveState();
            renderMathsSummary();
            renderClustersList();
        }

        // Set Cluster Value via Direct Input
        function setClusterValue(clusterId, val, max) {
            let num = parseInt(val) || 0;
            if (num < 0) num = 0;
            if (num > max) num = max;

            appState.clusterProgress[clusterId] = num;
            saveState();
            renderMathsSummary();
            renderClustersList();
        }
    </script>
</body>
</html>
